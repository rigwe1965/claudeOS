name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    # The project targets Windows 10 (waitress, PowerShell), so test where it runs.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-v1

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint (real bugs only)
        # Syntax errors and undefined names. Style rules are left off on purpose.
        run: |
          python -m pip install ruff
          python -m ruff check --select E9,F63,F7,F82 --exclude .venv,dist,vault,data,outputs,logs .

      - name: Dependency audit (informational)
        # Non-blocking for now: known issues sit in transitive packages (Pillow, tornado,
        # transformers) whose upgrades need testing against the pinned NumPy/ChromaDB stack.
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          python -m pip_audit --skip-editable

      - name: Run tests
        env:
          # Throwaway value for tests only. Locally this comes from .env, which CI doesn't have.
          CLAUDEOS_SECRET_KEY: ci-test-secret-key-not-used-anywhere-0123456789
          # Fake key: the tests never call the real API.
          ANTHROPIC_API_KEY: sk-ant-fake-ci-key
        run: python -m pytest tests -q --no-header -p no:cacheprovider
